[package]
name = "rust_taskbar"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
toml = "1.1.8"
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_Security", "Win32_System_DataExchange", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Bluetooth", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Devices_Bluetooth_Rfcomm", "Devices_Enumeration", "Win32_Globalization", "Devices_Radios"] }

[build-dependencies]
slint-build = "1.18.1"

[workspace]
members = ["winkey_hook", "webservices"]
